name: Atualizar JSON de teste

# Somente execução manual — sem agendamento (recorrência ainda não configurada).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar JSON fictício
        run: node scripts/generate.mjs

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-briefing-test.json
          git commit -m "Atualiza weekly-briefing-test.json (run ${GITHUB_RUN_ID})" || echo "Sem mudanças"
          git push
